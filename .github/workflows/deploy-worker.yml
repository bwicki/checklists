# Deployt den Cloudflare Worker bei jeder Änderung unter worker/.
# Benötigt die Repository-Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID (siehe SETUP.md).
# Läuft erst, nachdem «Setup worker» einmal durchgelaufen ist (database_id in wrangler.toml);
# vorher wird der Lauf mit einem Hinweis übersprungen.
name: Deploy worker
on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Einrichtung prüfen
        id: check
        working-directory: worker
        run: |
          if grep -qE 'database_id = ""' wrangler.toml; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Noch nicht eingerichtet – zuerst Actions → «Setup worker» → Run workflow ausführen. Dieser Lauf wird übersprungen."
            { echo "## Übersprungen"; echo; echo "Der Worker ist noch nicht eingerichtet. Zuerst **Actions → Setup worker → Run workflow** ausführen (SETUP.md, Abschnitt 3)."; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Schema nachziehen (wiederholbar)
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --no-audit --no-fund
          npx wrangler d1 execute checklists --remote --yes --file=schema.sql
          # Migrationen (je eine Anweisung; Fehler = schon eingespielt)
          for m in migrations/*.sql; do
            [ -f "$m" ] || continue
            npx wrangler d1 execute checklists --remote --yes --file="$m" >/dev/null 2>&1 && echo "Migration $m eingespielt" || echo "Migration $m übersprungen (schon vorhanden)"
          done
      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
